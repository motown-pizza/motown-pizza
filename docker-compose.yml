services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres_motown_pizza
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: motown_pizza
    ports:
      - '5434:5432'
    volumes:
      - postgres_data_motown_pizza:/var/lib/postgresql/data

volumes:
  postgres_data_motown_pizza:
